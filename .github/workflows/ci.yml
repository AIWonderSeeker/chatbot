name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Secret scan (all tracked files)
        run: python3 scripts/check_secrets.py --all

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy app mcp_server

      - name: Unit tests
        run: pytest -q

      - name: Integration tests (local MCP server over HTTP)
        run: pytest -q -m integration
