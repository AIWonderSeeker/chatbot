[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nl-snowflake-assistant"
version = "0.1.0"
description = "Natural-language assistant over Snowflake claims/provider data via Bedrock + MCP"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
api = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "boto3>=1.35",
  "mcp>=1.10,<2",
  "httpx>=0.27",
  "PyJWT[crypto]>=2.8",
]
mcp-server = [
  "mcp>=1.10,<2",
  "uvicorn[standard]>=0.30",
  "snowflake-connector-python>=3.12",
  "cryptography>=42",
  "psycopg[binary]>=3.2,<4",
  "boto3>=1.35",
]
dev = [
  "nl-snowflake-assistant[api,mcp-server]",
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.11",
  "boto3-stubs[bedrock-runtime,dynamodb]",
]

[tool.setuptools.packages.find]
include = ["app*", "mcp_server*"]

[tool.setuptools.package-data]
app = ["static/*"]
mcp_server = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: starts a local MCP server over HTTP"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE"]
ignore = ["S101", "S608"]  # asserts in tests; S608 is reviewed: identifiers come from validated mapping

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]
